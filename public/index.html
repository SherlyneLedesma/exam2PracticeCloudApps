<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSCE 20303 Web Systems</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white p-4">

    <!-- Top Left Minimal Title Header -->
    <div class="mb-4">
        <h4 class="fw-normal text-dark" style="font-family: sans-serif;">CSCE 20303 Web Systems</h4>
    </div>

    <div class="container-fluid px-0">
        <!-- Control Row: Refresh Button & Inline Dynamic Timestamp -->
        <div class="d-flex align-items-center gap-3 mb-3">
            <button id="refreshBtn" class="btn btn-primary btn-sm px-3 rounded-2">Refresh Users</button>
            <span id="timestamp" class="text-muted" style="font-size: 0.8rem;"></span>
        </div>

        <!-- Full Width Data Grid Table View -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle mb-5">
                <thead class="table-light">
                    <tr>
                        <th scope="col" style="width: 8%;">User ID</th>
                        <th scope="col" style="width: 12%;">Last Name</th>
                        <th scope="col" style="width: 12%;">First Name</th>
                        <th scope="col" style="width: 33%;">Email</th>
                        <th scope="col" style="width: 15%;">Username</th>
                        <th scope="col" style="width: 20%;">Password</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Data populated dynamically -->
                </tbody>
            </table>
        </div>

        <!-- Lower Section: Add User Form (Moved underneath table view) -->
        <div class="row">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border mt-4">
                    <div class="card-header bg-light">
                        <h6 class="mb-0 fw-bold text-secondary">Add New User Profile</h6>
                    </div>
                    <div class="card-body">
                        <form id="addUserForm">
                            <div class="mb-2">
                                <label for="username" class="form-label small mb-1">Username</label>
                                <input type="text" class="form-control form-control-sm" id="username" required>
                            </div>
                            <div class="row g-2">
                                <div class="col mb-2">
                                    <label for="firstname" class="form-label small mb-1">First Name</label>
                                    <input type="text" class="form-control form-control-sm" id="firstname" required>
                                </div>
                                <div class="col mb-2">
                                    <label for="lastname" class="form-label small mb-1">Last Name</label>
                                    <input type="text" class="form-control form-control-sm" id="lastname" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label for="email" class="form-label small mb-1">Email</label>
                                <input type="email" class="form-control form-control-sm" id="email" required>
                            </div>
                            <div class="mb-2">
                                <label for="passwd" class="form-label small mb-1">Password</label>
                                <input type="password" class="form-control form-control-sm" id="passwd" required>
                            </div>
                            <div class="mb-3">
                                <label for="urole" class="form-label small mb-1">Role</label>
                                <select class="form-select form-select-sm" id="urole" required>
                                    <option value="User" selected>User</option>
                                    <option value="Admin">Admin</option>
                                    <option value="Manager">Manager</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100">Save Row Entry</button>
                        </form>
                        <div id="alertPlaceholder" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="users.js"></script>
</body>
</html>
